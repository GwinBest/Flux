# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
        build_type: [ debug, release ]
        c_compiler: [ gcc-14, clang-19, clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: ubuntu-24.04
            c_compiler: clang-19
            cpp_compiler: clang++-19
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc-14
          - os: windows-latest
            c_compiler: clang-19
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-24.04
            c_compiler: cl
          - os: ubuntu-24.04
            c_compiler: clang
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc-14
          - os: macos-latest
            c_compiler: clang-19

    steps:
      - uses: actions/checkout@v4

      - name: Install Compilers (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Chrome is not needed for this build; its repository can break apt updates.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-19

      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DBUILD_TEST=ON
          -DBUILD_DEMO=OFF

      - name: Build
        run: >
          cmake --build 
          --preset ${{ matrix.build_type }} 
          --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }}

  build-mingw:
    name: MinGW (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug, release ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=g++
          -DBUILD_DEMO=ON
          -DENABLE_COVERAGE=${{ matrix.build_type == 'debug' && 'ON' || 'OFF' }}
          -DBUILD_TEST=ON
          -DENABLE_CLANG_TIDY=OFF
          -DENABLE_CLANG_FORMAT=OFF
          -DENABLE_ASAN=OFF
          -DENABLE_UBSAN=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --no-tests=error

  build-clang-cl:
    name: Windows clang-cl (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug, release ]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }} -A x64 -T ClangCL
          -DBUILD_TEST=ON
          -DENABLE_CLANG_TIDY=OFF
          -DENABLE_CLANG_FORMAT=OFF
          -DENABLE_ASAN=OFF
          -DENABLE_UBSAN=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --build-config ${{ matrix.build_type == 'debug' && 'Debug' || 'Release' }} --no-tests=error

  build-linux-extra:
    name: Linux ${{ matrix.variant }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: GCC coverage + demo
            os: ubuntu-24.04
            build_type: debug
            compiler: g++-14
            packages: g++-14
            cmake_args: -DENABLE_COVERAGE=ON -DBUILD_DEMO=ON
          - variant: Clang coverage + demo
            os: ubuntu-24.04
            build_type: debug
            compiler: clang++-22
            packages: clang-22 libclang-rt-22-dev llvm-22
            cmake_args: -DENABLE_COVERAGE=ON -DBUILD_DEMO=ON
          - variant: ASan + UBSan
            os: ubuntu-24.04
            build_type: debug
            compiler: clang++-22
            packages: clang-22 libclang-rt-22-dev llvm-22
            cmake_args: -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
          - variant: TSan
            os: ubuntu-24.04
            build_type: debug
            compiler: clang++-22
            packages: clang-22 libclang-rt-22-dev llvm-22
            cmake_args: -DENABLE_TSAN=ON
          - variant: libc++
            os: ubuntu-24.04
            build_type: debug
            compiler: clang++-22
            packages: clang-22 libc++-22-dev libc++abi-22-dev
            cmake_args: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          - variant: libc++
            os: ubuntu-24.04
            build_type: release
            compiler: clang++-22
            packages: clang-22 libc++-22-dev libc++abi-22-dev
            cmake_args: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          - variant: ARM64
            os: ubuntu-24.04-arm
            build_type: debug
            compiler: g++-14
            packages: g++-14
            cmake_args: ''
          - variant: ARM64
            os: ubuntu-24.04-arm
            build_type: release
            compiler: g++-14
            packages: g++-14
            cmake_args: ''
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and libraries
        run: |
          # Chrome's repository can break apt updates on hosted runners.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          if [ "${{ matrix.compiler }}" = "clang++-22" ]; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 22
          fi
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DBUILD_TEST=ON
          -DENABLE_CLANG_TIDY=OFF
          -DENABLE_CLANG_FORMAT=OFF
          -DENABLE_ASAN=OFF
          -DENABLE_UBSAN=OFF
          -DENABLE_TSAN=OFF
          -DENABLE_SANITIZERS_STRICT=ON
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --no-tests=error

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 tools
        run: |
          # Chrome is not needed for linting; its repository can break apt updates.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang-format-22 clang-tidy-22

      - name: Configure CMake (strict lint mode)
        run: >
          cmake --preset debug
          -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++
          -DBUILD_TEST=ON
          -DENABLE_ASAN=OFF
          -DENABLE_UBSAN=OFF
          -DENABLE_CLANG_TIDY=ON
          -DENABLE_CLANG_FORMAT=ON
          -DENABLE_LINT_STRICT=ON
          -DCLANG_TIDY_EXE=/usr/lib/llvm-22/bin/clang-tidy
          -DCLANG_FORMAT_EXE=/usr/lib/llvm-22/bin/clang-format

      - name: Check formatting
        run: cmake --build --preset debug --target format-check

      - name: Build with clang-tidy
        run: cmake --build --preset debug --config Debug
