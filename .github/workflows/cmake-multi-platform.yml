name: CMake on multiple platforms

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        build_type: [ Debug, Release ]
        c_compiler: [ gcc-14, clang-18, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: ubuntu-latest
            c_compiler: clang-18
            cpp_compiler: clang++-18
          - os: macos-latest
            c_compiler: clang-18
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc-14
          - os: windows-latest
            c_compiler: clang-18
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Compilers on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-18 clang++-18

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TEST=ON
          -DENABLE_CLANG_TIDY=OFF
          -DENABLE_CLANG_FORMAT=OFF
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Compilers and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang++-18
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y clang-format-22 clang-tidy-22

      - name: Configure CMake (strict lint mode)
        run: >
          cmake -B ${{ github.workspace }}/build-lint
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TEST=ON
          -DENABLE_ASAN=OFF
          -DENABLE_UBSAN=OFF
          -DENABLE_CLANG_TIDY=ON
          -DENABLE_CLANG_FORMAT=ON
          -DENABLE_LINT_STRICT=ON
          -DCLANG_TIDY_EXE=/usr/lib/llvm-22/bin/clang-tidy
          -DCLANG_FORMAT_EXE=/usr/lib/llvm-22/bin/clang-format
          -S ${{ github.workspace }}

      - name: Check formatting
        run: cmake --build ${{ github.workspace }}/build-lint --target format-check

      - name: Build with clang-tidy
        run: cmake --build ${{ github.workspace }}/build-lint --config Debug
